<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a7c5a">
  <title>HSPC ERP — Login</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-card glass">
      <div class="brand-mark">H</div>
      <div class="eyebrow">HOME SAFETY PEST CONTROL SERVICE</div>
      <h1>HSPC ERP</h1>
      <p class="muted">Operations, CRM, inventory, sales, finance and HR in one system.</p>

      <form id="loginForm" class="stack">
        <label>Username
          <input id="username" autocomplete="username" value="admin" required>
        </label>

        <label>Password
          <input id="password" type="password" autocomplete="current-password" value="admin123" required>
        </label>

        <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
        <div id="loginError" class="alert danger hidden"></div>
      </form>
    </section>
  </main>

  <script>
    if (localStorage.getItem("hspc_token")) {
      location.href = "/";
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const error = document.getElementById("loginError");
      error.classList.add("hidden");

      try {
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        });

        const data = await r.json();

        if (!r.ok) {
          throw new Error(data.error || "Login failed");
        }

        localStorage.setItem("hspc_token", data.token);
        localStorage.setItem("hspc_user", JSON.stringify(data.user));

        location.href = "/";
      } catch (err) {
        error.textContent = err.message;
        error.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
